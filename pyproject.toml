[project]
name = "idx-stock-mcp"
version = "0.1.0"
description = "MCP Server for Indonesian Stock Market (IDX) - provides real-time stock data, technical indicators, fundamental analysis, money flow, and macro data tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "cachetools>=5.3.0",
]

[project.scripts]
idx-stock-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
